<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="650" fill="url(#bgGrad)" rx="16"/>
  <rect x="10" y="10" width="880" height="630" fill="none" stroke="#1e293b" stroke-width="2" rx="12"/>

  <!-- Header -->
  <text x="450" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">INSTITUTIONAL INVESTIGATION &amp; ADMIN FLOW</text>
  <text x="450" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Real-Time Event Ingestion, Case Triage, Graph Traversal &amp; Audit Resolution</text>

  <!-- Step 1: Socket Dispatch -->
  <g transform="translate(100, 95)">
    <rect width="320" height="70" rx="8" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="160" y="26" fill="#f87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Real-Time Socket Broadcast</text>
    <text x="160" y="44" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Socket.IO emits `HIGH_RISK_TRANSACTION`</text>
    <text x="160" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Target Room: `admin` (No page refresh needed)</text>
  </g>

  <!-- Step 2: Auto-Spawn Case -->
  <g transform="translate(480, 95)">
    <rect width="320" height="70" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="160" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Automated Fraud Case Ingestion</text>
    <text x="160" y="44" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Creates Investigation Ticket with Risk Score</text>
    <text x="160" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Status: `OPEN` / `UNDER_REVIEW`</text>
  </g>

  <line x1="420" y1="130" x2="480" y2="130" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="480,130 472,126 472,134" fill="#f59e0b"/>

  <line x1="640" y1="165" x2="640" y2="200" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="640,203 636,195 644,195" fill="#f59e0b"/>

  <!-- Step 3: Investigator Action Grid -->
  <g transform="translate(80, 205)">
    <rect width="740" height="155" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="370" y="26" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Investigator Command &amp; Intelligence Tools</text>

    <!-- Sub 1 -->
    <rect x="25" y="45" width="215" height="90" rx="6" fill="#1e1e38" stroke="#38bdf8" stroke-width="1"/>
    <text x="132" y="66" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Live Risk Feed Monitor</text>
    <text x="132" y="86" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Sub-second transaction streaming</text>
    <text x="132" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Color-coded risk thresholds</text>
    <text x="132" y="118" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Direct deep-link to case details</text>

    <!-- Sub 2 -->
    <rect x="262" y="45" width="215" height="90" rx="6" fill="#1e1e38" stroke="#ec4899" stroke-width="1"/>
    <text x="369" y="66" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Multi-Hop Fraud Graph</text>
    <text x="369" y="86" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">1–3 hop relationship traversal</text>
    <text x="369" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Identifies shared device mule rings</text>
    <text x="369" y="118" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Interactive node physics (Vis.js)</text>

    <!-- Sub 3 -->
    <rect x="500" y="45" width="215" height="90" rx="6" fill="#1e1e38" stroke="#10b981" stroke-width="1"/>
    <text x="607" y="66" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">False-Positive Hub</text>
    <text x="607" y="86" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Reviews user-submitted feedback</text>
    <text x="607" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Overrule false alarms &amp; whitelist</text>
    <text x="607" y="118" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Feeds model calibration</text>
  </g>

  <line x1="450" y1="360" x2="450" y2="395" stroke="#6366f1" stroke-width="2"/>
  <polygon points="450,398 446,390 454,390" fill="#6366f1"/>

  <!-- Step 4: Resolution Disposition -->
  <g transform="translate(150, 400)">
    <rect width="600" height="100" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2"/>
    <text x="300" y="24" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Case Resolution &amp; Enforcement Actions</text>

    <!-- 3 Action Badges -->
    <rect x="25" y="38" width="165" height="48" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="107" y="58" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CONFIRMED FRAUD</text>
    <text x="107" y="74" fill="#fecaca" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Freeze recipient &amp; device</text>

    <rect x="215" y="38" width="165" height="48" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="297" y="58" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FALSE POSITIVE</text>
    <text x="297" y="74" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Whitelist &amp; refine thresholds</text>

    <rect x="405" y="38" width="165" height="48" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="487" y="58" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">RESOLVED / DISMISSED</text>
    <text x="487" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Standard closure with notes</text>
  </g>

  <line x1="450" y1="500" x2="450" y2="535" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="450,538 446,530 454,530" fill="#f59e0b"/>

  <!-- Step 5: Audit Log -->
  <g transform="translate(250, 540)">
    <rect width="400" height="55" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="200" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Immutable Compliance Audit Log</text>
    <text x="200" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Timestamp, Investigator ID, Decision Notes, and Action Diff</text>
  </g>
</svg>
