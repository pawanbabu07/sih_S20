<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGrad)" rx="16"/>
  <rect x="10" y="10" width="980" height="680" fill="none" stroke="#1e293b" stroke-width="2" rx="12"/>

  <!-- Title Header -->
  <text x="500" y="45" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="1">FRAUDSHIELD: SYSTEM ARCHITECTURE</text>
  <text x="500" y="68" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Explainable Real-Time Multi-Signal Fraud Prevention Architecture</text>

  <!-- Top: User & Client Layer -->
  <g transform="translate(370, 95)">
    <rect width="260" height="60" rx="10" fill="url(#blueCard)" stroke="#3b82f6" stroke-width="2" filter="url(#glow)"/>
    <text x="130" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">USER CLIENT LAYER</text>
    <text x="130" y="48" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">React 18 + Vite + Material UI</text>
  </g>

  <!-- Flow Line 1 -->
  <line x1="500" y1="155" x2="500" y2="195" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="500,198 495,190 505,190" fill="#38bdf8"/>

  <!-- Middle: Backend Gateway -->
  <g transform="translate(350, 198)">
    <rect width="300" height="65" rx="10" fill="url(#blueCard)" stroke="#6366f1" stroke-width="2"/>
    <text x="150" y="28" fill="#818cf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">NODE.JS &amp; EXPRESS GATEWAY</text>
    <text x="150" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">REST APIs + Socket.IO Real-Time Engine + JWT</text>
  </g>

  <!-- 3 Sub-Engine Connectors -->
  <path d="M 400 263 L 400 290 L 160 290 L 160 320" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="160,323 156,315 164,315" fill="#64748b"/>

  <path d="M 500 263 L 500 320" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="500,323 496,315 504,315" fill="#64748b"/>

  <path d="M 600 263 L 600 290 L 840 290 L 840 320" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="840,323 836,315 844,315" fill="#64748b"/>

  <!-- Layer 3: 5 Defense Signal Modules -->
  <!-- Module 1: ML Microservice -->
  <g transform="translate(60, 325)">
    <rect width="200" height="70" rx="8" fill="url(#blueCard)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="100" y="26" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Python ML Service</text>
    <text x="100" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Calibrated Logistic / RF</text>
    <text x="100" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Probability &amp; XAI Importances</text>
  </g>

  <!-- Module 2: Voice Shield -->
  <g transform="translate(280, 325)">
    <rect width="200" height="70" rx="8" fill="url(#blueCard)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="100" y="26" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Voice Phishing Shield</text>
    <text x="100" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Acoustic / NLP Token Scan</text>
    <text x="100" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">OTP / Impersonation Flags</text>
  </g>

  <!-- Module 3: Device & Behavioral -->
  <g transform="translate(520, 325)">
    <rect width="200" height="70" rx="8" fill="url(#blueCard)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="100" y="26" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Device &amp; Behavioral</text>
    <text x="100" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Hardware Trust Scoring</text>
    <text x="100" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Velocity &amp; Anomaly Baseline</text>
  </g>

  <!-- Module 4: Fraud Graph -->
  <g transform="translate(740, 325)">
    <rect width="200" height="70" rx="8" fill="url(#blueCard)" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="100" y="26" fill="#fb7185" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Fraud Graph Engine</text>
    <text x="100" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">BFS Multi-Hop Traversal</text>
    <text x="100" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Mule &amp; Ring Detection</text>
  </g>

  <!-- Convergence to Central Risk Engine -->
  <path d="M 160 395 L 160 435 L 480 435 L 480 460" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <path d="M 380 395 L 380 425 L 490 425 L 490 460" fill="none" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M 620 395 L 620 425 L 510 425 L 510 460" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  <path d="M 840 395 L 840 435 L 520 435 L 520 460" fill="none" stroke="#fb7185" stroke-width="1.5"/>
  <polygon points="500,465 495,456 505,456" fill="#f59e0b"/>

  <!-- Layer 4: Central Risk Engine -->
  <g transform="translate(320, 465)">
    <rect width="360" height="70" rx="10" fill="url(#blueCard)" stroke="url(#accentOrange)" stroke-width="2.5" filter="url(#glow)"/>
    <text x="180" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">CENTRAL COMPOSITE RISK ENGINE</text>
    <text x="180" y="46" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Dynamic Signal Normalization + Weighted Aggregation</text>
    <text x="180" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Outputs: Risk Score (0-100) + XAI Reasoning Bullet Points</text>
  </g>

  <!-- Split Output Lines -->
  <path d="M 400 535 L 400 575 L 240 575 L 240 600" fill="none" stroke="#10b981" stroke-width="2"/>
  <polygon points="240,603 236,595 244,595" fill="#10b981"/>

  <path d="M 600 535 L 600 575 L 760 575 L 760 600" fill="none" stroke="#ef4444" stroke-width="2"/>
  <polygon points="760,603 756,595 764,595" fill="#ef4444"/>

  <!-- Bottom Left: User Decision -->
  <g transform="translate(120, 605)">
    <rect width="240" height="65" rx="8" fill="url(#blueCard)" stroke="#10b981" stroke-width="2"/>
    <text x="120" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">USER TIERED INTERVENTION</text>
    <text x="120" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">LOW: Pass | MED: Confirm</text>
    <text x="120" y="56" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">HIGH: Strong XAI Warning / Cancel</text>
  </g>

  <!-- Bottom Right: Admin Investigation -->
  <g transform="translate(640, 605)">
    <rect width="240" height="65" rx="8" fill="url(#blueCard)" stroke="#ef4444" stroke-width="2"/>
    <text x="120" y="24" fill="#f87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ADMIN &amp; COMPLIANCE PORTAL</text>
    <text x="120" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Real-Time Socket Stream</text>
    <text x="120" y="56" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Case Triage, Graph View &amp; Audit Log</text>
  </g>
</svg>
