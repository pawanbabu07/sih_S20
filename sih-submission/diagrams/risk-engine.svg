<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="650" fill="url(#bgGrad)" rx="16"/>
  <rect x="10" y="10" width="880" height="630" fill="none" stroke="#1e293b" stroke-width="2" rx="12"/>

  <!-- Title -->
  <text x="450" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">CENTRAL MULTI-SIGNAL RISK ENGINE</text>
  <text x="450" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Mathematical Weighting, Dynamic Normalization &amp; Explainability Pipeline</text>

  <!-- 5 Input Channels -->
  <g transform="translate(60, 95)">
    <!-- Channel 1 -->
    <rect x="0" y="0" width="140" height="90" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Transaction ML</text>
    <text x="70" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">W₁ = 0.30</text>
    <text x="70" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Calibrated Prob</text>
    <text x="70" y="78" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Score: 0–100</text>

    <!-- Channel 2 -->
    <rect x="160" y="0" width="140" height="90" rx="8" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="230" y="24" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Behavioral Dev</text>
    <text x="230" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">W₂ = 0.20</text>
    <text x="230" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Time/Multiplier Dev</text>
    <text x="230" y="78" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Score: 0–100</text>

    <!-- Channel 3 -->
    <rect x="320" y="0" width="140" height="90" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="390" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Device Trust</text>
    <text x="390" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">W₃ = 0.20</text>
    <text x="390" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Hardware Fingerprint</text>
    <text x="390" y="78" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Score: 0–100</text>

    <!-- Channel 4 -->
    <rect x="480" y="0" width="140" height="90" rx="8" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5"/>
    <text x="550" y="24" fill="#f472b6" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Voice Phishing</text>
    <text x="550" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">W₄ = 0.15</text>
    <text x="550" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">NLP Coercion &amp; OTP</text>
    <text x="550" y="78" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Score: 0–100 (or Null)</text>

    <!-- Channel 5 -->
    <rect x="640" y="0" width="140" height="90" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="710" y="24" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Fraud Graph</text>
    <text x="710" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">W₅ = 0.15</text>
    <text x="710" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Mule &amp; Ring Proximity</text>
    <text x="710" y="78" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Score: 0–100</text>
  </g>

  <!-- Formula Card -->
  <g transform="translate(150, 210)">
    <rect width="600" height="110" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
    <text x="300" y="30" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">DYNAMIC COMPOSITE NORMALIZATION FORMULA</text>
    
    <text x="300" y="62" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">R_composite = ( Σ [ W_i * S_i ] ) / ( Σ W_i )</text>
    <text x="300" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">If Voice signal is absent (no active call), W₄ drops to 0 and Σ W_i re-normalizes to 0.85</text>
  </g>

  <line x1="450" y1="320" x2="450" y2="355" stroke="#6366f1" stroke-width="2"/>
  <polygon points="450,358 446,350 454,350" fill="#6366f1"/>

  <!-- Explainability Engine -->
  <g transform="translate(200, 360)">
    <rect width="500" height="75" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="250" y="26" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Explainable AI (XAI) Synthesis Layer</text>
    <text x="250" y="46" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Generates Contextual Plain-Text Bullet Points for Risk Triggers</text>
    <text x="250" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">e.g., "8.0x above average", "Unrecognized device", "OTP keyword present"</text>
  </g>

  <line x1="450" y1="435" x2="450" y2="470" stroke="#10b981" stroke-width="2"/>
  <polygon points="450,473 446,465 454,465" fill="#10b981"/>

  <!-- Tiered Enforcement -->
  <g transform="translate(100, 475)">
    <rect width="700" height="135" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2"/>
    <text x="350" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">TIERED ENFORCEMENT &amp; DISPATCH MATRIX</text>

    <!-- 3 columns -->
    <rect x="25" y="40" width="200" height="75" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="125" y="62" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">LOW RISK (0–39)</text>
    <text x="125" y="80" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Frictionless Instant Allow</text>
    <text x="125" y="96" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">No Interruption</text>

    <rect x="250" y="40" width="200" height="75" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
    <text x="350" y="62" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">MEDIUM RISK (40–69)</text>
    <text x="350" y="80" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Warn &amp; Verify Modal</text>
    <text x="350" y="96" fill="#fef08a" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">User Confirmation Required</text>

    <rect x="475" y="40" width="200" height="75" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="575" y="62" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">HIGH RISK (70–100)</text>
    <text x="575" y="80" fill="#fecaca" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Strong Explainable Warning</text>
    <text x="575" y="96" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Cancel Choice + Live Socket Alert</text>
  </g>
</svg>
