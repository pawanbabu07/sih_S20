<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Top Admin Navbar -->
  <rect x="0" y="0" width="1200" height="65" fill="#0f172a"/>
  <line x1="0" y1="65" x2="1200" y2="65" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="40" fill="#ef4444" font-family="system-ui, sans-serif" font-size="18" font-weight="900">🛡️ FRAUDSHIELD INSTITUTION PORTAL</text>
  <text x="440" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Admin Dashboard</text>
  <text x="580" y="40" fill="#ef4444" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Live Monitor (Sockets) 🔴</text>
  <text x="740" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Fraud Graph</text>
  <text x="850" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Model Health</text>
  <text x="960" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Audit Logs</text>

  <!-- Live Feed Header -->
  <g transform="translate(60, 95)">
    <circle cx="10" cy="20" r="6" fill="#ef4444"/>
    <text x="25" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">REAL-TIME RISK STREAMING FEED</text>
    <rect x="420" y="8" width="160" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="500" y="25" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚡ WEBSOCKET ACTIVE</text>
    <text x="0" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Events stream instantaneously as transactions and voice transcripts evaluate. No manual refresh required.</text>

    <!-- Real-Time Event Stream List Container -->
    <g transform="translate(0, 75)">
      <rect width="1080" height="520" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Event 1 (Just Ingested via Socket) -->
      <g transform="translate(20, 20)">
        <rect width="1040" height="100" rx="10" fill="#2d1217" stroke="#ef4444" stroke-width="2"/>
        <rect x="20" y="20" width="70" height="26" rx="13" fill="#ef4444"/>
        <text x="55" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">NEW LIVE</text>
        
        <text x="105" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">HIGH_RISK_TRANSACTION Intercepted</text>
        <text x="440" y="38" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Amount: ₹ 40,000</text>
        <text x="600" y="38" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Recipient: <tspan font-family="monospace">urgent_kyc_support@upi</tspan></text>
        <text x="940" y="38" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Score: 91/100</text>

        <!-- Explainable Tags -->
        <g transform="translate(20, 60)">
          <rect x="0" y="0" width="180" height="26" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
          <text x="10" y="17" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11">🎙️ Active KYC Vishing Call</text>

          <rect x="190" y="0" width="180" height="26" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
          <text x="200" y="17" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11">📈 8.0x Historical Amount</text>

          <rect x="380" y="0" width="200" height="26" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
          <text x="390" y="17" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11">🕸️ Syndicate Mule Node Match</text>

          <rect x="780" y="0" width="120" height="26" rx="6" fill="#ef4444"/>
          <text x="840" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Inspect Case ➔</text>

          <rect x="910" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
          <text x="965" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">View Graph</text>
        </g>
      </g>

      <!-- Event 2 -->
      <g transform="translate(20, 135)">
        <rect width="1040" height="90" rx="8" fill="#1e1e38" stroke="#334155" stroke-width="1"/>
        <text x="25" y="32" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">VOICE_RISK_DETECTED</text>
        <text x="240" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Session: <tspan font-family="monospace">sess_v9021_a1f9</tspan></text>
        <text x="480" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Threat: <tspan font-weight="700">AUTHORITY_IMPERSONATION (RBI KYC)</tspan></text>
        <text x="940" y="32" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Score: 96/100</text>
        <text x="25" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Transcript Extract: "Your bank KYC is expired... transfer ₹40,000 immediately or account permanently blocked..."</text>
      </g>

      <!-- Event 3 -->
      <g transform="translate(20, 240)">
        <rect width="1040" height="90" rx="8" fill="#141c2e" stroke="#1e293b" stroke-width="1"/>
        <text x="25" y="32" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="13" font-weight="700">MEDIUM_RISK_TRANSACTION</text>
        <text x="240" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Amount: ₹ 8,000</text>
        <text x="480" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Receiver: <tspan font-family="monospace">freelancer_rahul@upi</tspan></text>
        <text x="940" y="32" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Score: 54/100</text>
        <text x="25" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Signals: First-time recipient handle + unusual evening payment velocity. Warn &amp; Confirm modal accepted by user.</text>
      </g>

      <!-- Event 4 -->
      <g transform="translate(20, 345)">
        <rect width="1040" height="90" rx="8" fill="#141c2e" stroke="#1e293b" stroke-width="1"/>
        <text x="25" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">LOW_RISK_TRANSACTION (PASSED)</text>
        <text x="240" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Amount: ₹ 500</text>
        <text x="480" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Receiver: <tspan font-family="monospace">groceries@upi (FreshMart)</tspan></text>
        <text x="940" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Score: 12/100</text>
        <text x="25" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Signals: Verified habitual merchant + trusted primary hardware fingerprint. Instant frictionless authorization.</text>
      </g>
    </g>
  </g>
</svg>
