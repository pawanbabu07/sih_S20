<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Top Admin Navbar -->
  <rect x="0" y="0" width="1200" height="65" fill="#0f172a"/>
  <line x1="0" y1="65" x2="1200" y2="65" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="40" fill="#ef4444" font-family="system-ui, sans-serif" font-size="18" font-weight="900">🛡️ FRAUDSHIELD INSTITUTION PORTAL</text>
  <text x="440" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Admin Dashboard</text>
  <text x="580" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Live Monitor (Sockets)</text>
  <text x="740" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Fraud Graph 🕸️</text>
  <text x="850" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Model Health</text>
  <text x="960" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Audit Logs</text>

  <!-- Graph Explorer Header -->
  <g transform="translate(60, 95)">
    <text x="0" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Multi-Hop Fraud Syndicate Relationship Graph</text>
    <text x="0" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Breadth-First Search (BFS) graph clustering detecting mule networks, shared device hardware, and common IP subnets</text>

    <!-- Visual Graph Canvas Card -->
    <g transform="translate(0, 75)">
      <rect width="1080" height="520" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Controls Overlay (Top Right of Canvas) -->
      <g transform="translate(740, 20)">
        <rect width="320" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="15" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Depth:</text>
        <rect x="55" y="8" width="65" height="24" rx="4" fill="#3b82f6"/>
        <text x="87" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3 Hops</text>
        <text x="140" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Layout: Physics Force</text>
      </g>

      <!-- Graph Nodes and Interconnections -->
      <!-- Center: Root Device Node (Mule Hardware Ring) -->
      <line x1="540" y1="260" x2="320" y2="160" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5,5"/>
      <line x1="540" y1="260" x2="300" y2="360" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5,5"/>
      <line x1="540" y1="260" x2="760" y2="180" stroke="#ef4444" stroke-width="2.5"/>
      <line x1="540" y1="260" x2="780" y2="380" stroke="#f59e0b" stroke-width="2"/>
      <line x1="760" y1="180" x2="940" y2="140" stroke="#ef4444" stroke-width="2"/>
      <line x1="760" y1="180" x2="940" y2="240" stroke="#ef4444" stroke-width="2"/>

      <!-- Center Node: Flagged Hardware Fingerprint -->
      <g transform="translate(540, 260)">
        <circle cx="0" cy="0" r="42" fill="#7f1d1d" stroke="#ef4444" stroke-width="3"/>
        <text x="0" y="-8" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">📱</text>
        <text x="0" y="10" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">DEVICE #99b</text>
        <text x="0" y="24" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Shared Ring Root</text>
      </g>

      <!-- Victim User 1 (Demo User) -->
      <g transform="translate(320, 160)">
        <circle cx="0" cy="0" r="32" fill="#1e1e38" stroke="#38bdf8" stroke-width="2"/>
        <text x="0" y="-4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">👤</text>
        <text x="0" y="12" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">User: Rituraj M.</text>
        <text x="0" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">user@sih.in</text>
      </g>

      <!-- Victim User 2 -->
      <g transform="translate(300, 360)">
        <circle cx="0" cy="0" r="32" fill="#1e1e38" stroke="#f59e0b" stroke-width="2"/>
        <text x="0" y="-4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">👤</text>
        <text x="0" y="12" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Victim #102</text>
        <text x="0" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">₹35,000 Lost</text>
      </g>

      <!-- Suspicious Receiver (Mule Node) -->
      <g transform="translate(760, 180)">
        <circle cx="0" cy="0" r="38" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
        <text x="0" y="-6" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">🏦</text>
        <text x="0" y="10" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">urgent_kyc@upi</text>
        <text x="0" y="22" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Mule Ingestion</text>
      </g>

      <!-- Secondary Mule 1 -->
      <g transform="translate(940, 140)">
        <circle cx="0" cy="0" r="28" fill="#431407" stroke="#ea580c" stroke-width="1.5"/>
        <text x="0" y="4" fill="#fdba74" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Mule Layer 2</text>
        <text x="0" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">outflow@axis</text>
      </g>

      <!-- Secondary Mule 2 -->
      <g transform="translate(940, 240)">
        <circle cx="0" cy="0" r="28" fill="#431407" stroke="#ea580c" stroke-width="1.5"/>
        <text x="0" y="4" fill="#fdba74" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Mule Layer 2</text>
        <text x="0" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">crypto_p2p@upi</text>
      </g>

      <!-- Shared IP Subnet -->
      <g transform="translate(780, 380)">
        <circle cx="0" cy="0" r="30" fill="#1e1e38" stroke="#a855f7" stroke-width="1.5"/>
        <text x="0" y="4" fill="#c084fc" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">IP Subnet</text>
        <text x="0" y="16" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">103.212.x.x</text>
      </g>

      <!-- Legend Panel (Bottom Left of Canvas) -->
      <g transform="translate(25, 420)">
        <rect width="360" height="85" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="15" y="22" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="700">GRAPH ENTITY LEGEND:</text>
        <circle cx="25" cy="45" r="7" fill="#38bdf8"/>
        <text x="40" y="49" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">User Node</text>

        <circle cx="125" cy="45" r="7" fill="#ef4444"/>
        <text x="140" y="49" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Flagged Hardware</text>

        <circle cx="260" cy="45" r="7" fill="#ea580c"/>
        <text x="275" y="49" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Mule Recipient</text>

        <text x="15" y="72" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">⚡ Coordinated Syndicate Ring Detected (Cluster: Alpha-99)</text>
      </g>
    </g>
  </g>
</svg>
