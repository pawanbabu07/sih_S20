<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1200" height="65" fill="#0f172a"/>
  <line x1="0" y1="65" x2="1200" y2="65" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="800">🛡️ FRAUDSHIELD</text>
  <text x="240" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Dashboard</text>
  <text x="340" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Make Payment</text>
  <text x="460" y="40" fill="#a855f7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Voice Shield 🎙️</text>
  <text x="570" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Security Center</text>

  <!-- Content Grid -->
  <g transform="translate(80, 100)">
    <!-- Header -->
    <text x="0" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Voice Phishing &amp; Social Engineering Shield</text>
    <text x="0" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Real-time in-memory acoustic speech-to-text and NLP scam lexicon detection</text>

    <!-- Active Call Monitor Box (Left) -->
    <g transform="translate(0, 80)">
      <rect width="600" height="520" rx="12" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
      <rect x="25" y="25" width="550" height="40" rx="6" fill="#1e1b4b"/>
      <circle cx="45" cy="45" r="6" fill="#ef4444"/>
      <text x="60" y="49" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">LIVE AUDIO SCANNING ACTIVE</text>
      <text x="430" y="49" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11">Ephemeral In-Memory</text>

      <!-- Audio Waveform Graphic Mock -->
      <g transform="translate(40, 90)">
        <rect x="0" y="15" width="6" height="20" rx="3" fill="#8b5cf6"/>
        <rect x="12" y="5" width="6" height="40" rx="3" fill="#ec4899"/>
        <rect x="24" y="0" width="6" height="50" rx="3" fill="#38bdf8"/>
        <rect x="36" y="10" width="6" height="30" rx="3" fill="#8b5cf6"/>
        <rect x="48" y="20" width="6" height="10" rx="3" fill="#ec4899"/>
        <rect x="60" y="5" width="6" height="40" rx="3" fill="#38bdf8"/>
        <rect x="72" y="0" width="6" height="50" rx="3" fill="#8b5cf6"/>
        <rect x="84" y="12" width="6" height="26" rx="3" fill="#ec4899"/>
        <rect x="96" y="18" width="6" height="14" rx="3" fill="#38bdf8"/>
        <text x="130" y="30" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Processing Audio Buffer (Web Speech API)</text>
      </g>

      <!-- Live Transcript Box -->
      <text x="25" y="180" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">REAL-TIME CONVERSATION TRANSCRIPT:</text>
      <rect x="25" y="195" width="550" height="180" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
      <text x="40" y="230" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">"Hello sir, I am calling from <tspan fill="#ef4444" font-weight="700">RBI head office</tspan>."</text>
      <text x="40" y="260" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">"Your bank KYC has expired. You must transfer ₹40,000</text>
      <text x="40" y="285" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13"><tspan fill="#ef4444" font-weight="700">immediately</tspan> or your account will be <tspan fill="#ef4444" font-weight="700">permanently blocked</tspan></text>
      <text x="40" y="310" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">within <tspan fill="#ef4444" font-weight="700">10 minutes</tspan>. Tell me the <tspan fill="#ef4444" font-weight="700">6-digit OTP</tspan> right now."</text>

      <!-- Test Presets Selector -->
      <text x="25" y="415" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">TEST PRESET AUDIOS:</text>
      <rect x="25" y="430" width="170" height="34" rx="6" fill="#7f1d1d"/>
      <text x="110" y="451" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🚨 Bank KYC Impersonation</text>

      <rect x="205" y="430" width="170" height="34" rx="6" fill="#78350f"/>
      <text x="290" y="451" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚠️ AnyDesk Remote Access</text>

      <rect x="385" y="430" width="170" height="34" rx="6" fill="#064e3b"/>
      <text x="470" y="451" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">✅ Normal Family Call</text>

      <!-- Microphone toggle -->
      <rect x="25" y="475" width="550" height="42" rx="8" fill="url(#purpleGrad)"/>
      <text x="300" y="501" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🛑 Stop Listening &amp; Analyze Transcript</text>
    </g>

    <!-- Threat Analysis Panel (Right) -->
    <g transform="translate(630, 80)">
      <rect width="410" height="520" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
      
      <rect x="25" y="25" width="360" height="95" rx="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
      <text x="45" y="55" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="700">VOICE THREAT SCORE</text>
      <text x="45" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="900">96 / 100</text>
      <rect x="235" y="45" width="130" height="32" rx="16" fill="#0f172a"/>
      <text x="300" y="66" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">CRITICAL RISK</text>

      <!-- Detected Categories -->
      <text x="25" y="150" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">DETECTED SCAM CATEGORIES:</text>
      
      <rect x="25" y="165" width="360" height="40" rx="6" fill="#1e1e38"/>
      <text x="40" y="189" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12">🏛️</text>
      <text x="65" y="189" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Authority Impersonation (RBI/Police)</text>

      <rect x="25" y="215" width="360" height="40" rx="6" fill="#1e1e38"/>
      <text x="40" y="239" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12">⏳</text>
      <text x="65" y="239" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Extreme Urgency &amp; Coercion (10 mins)</text>

      <rect x="25" y="265" width="360" height="40" rx="6" fill="#1e1e38"/>
      <text x="40" y="289" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12">🔑</text>
      <text x="65" y="289" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Credential Demands (6-digit OTP)</text>

      <!-- Real-Time User Advice -->
      <rect x="25" y="325" width="360" height="110" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
      <text x="40" y="350" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700">⚠️ ADVISORY WARNING:</text>
      <text x="40" y="372" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Do not disclose any OTP or transfer funds.</text>
      <text x="40" y="390" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">RBI and legitimate banks never request urgent</text>
      <text x="40" y="408" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">money transfers to unblock accounts.</text>

      <!-- False Positive Feedback button -->
      <rect x="25" y="455" width="360" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="205" y="480" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Report as False Positive</text>
    </g>
  </g>
</svg>
