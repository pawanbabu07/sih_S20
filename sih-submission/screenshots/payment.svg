<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1200" height="65" fill="#0f172a"/>
  <line x1="0" y1="65" x2="1200" y2="65" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="800">🛡️ FRAUDSHIELD</text>
  <text x="240" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Dashboard</text>
  <text x="340" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Make Payment</text>
  <text x="460" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Voice Shield</text>
  <text x="570" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Security Center</text>

  <!-- Content Grid -->
  <g transform="translate(100, 110)">
    <!-- Left Column: Payment Form -->
    <rect width="550" height="580" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="35" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Initiate Protected UPI Transfer</text>
    <text x="35" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Transactions are analyzed across 5 layers prior to execution</text>

    <!-- Field 1: Recipient UPI ID -->
    <text x="35" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Recipient UPI Handle</text>
    <rect x="35" y="125" width="480" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="50" y="154" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14">urgent_kyc_support@upi</text>
    <rect x="420" y="133" width="85" height="30" rx="6" fill="#7f1d1d"/>
    <text x="462" y="152" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">UNRECOGNIZED</text>

    <!-- Field 2: Recipient Name -->
    <text x="35" y="200" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Recipient Display Name</text>
    <rect x="35" y="210" width="480" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="50" y="239" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14">RBI KYC Support Hub</text>

    <!-- Field 3: Amount -->
    <text x="35" y="285" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Transfer Amount (₹ INR)</text>
    <rect x="35" y="295" width="480" height="46" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="50" y="324" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">₹ 40,000</text>
    <text x="400" y="324" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="600">8.0x Above Avg</text>

    <!-- Preset Test Scenario Chips -->
    <text x="35" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">QUICK TEST PRESETS:</text>
    <rect x="35" y="390" width="145" height="34" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="107" y="411" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">₹500 Safe Grocery</text>

    <rect x="190" y="390" width="145" height="34" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
    <text x="262" y="411" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">₹8,000 New Freelancer</text>

    <rect x="345" y="390" width="170" height="34" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="430" y="411" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">₹40,000 KYC Scam Attempt</text>

    <!-- Pay Button -->
    <rect x="35" y="475" width="480" height="52" rx="8" fill="url(#primaryGrad)"/>
    <text x="275" y="507" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Evaluate &amp; Authorize Transfer ➔</text>
  </g>

  <!-- Right Column: Active Telemetry & Protection Status -->
  <g transform="translate(680, 110)">
    <rect width="420" height="580" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="30" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Pre-Flight Signal Telemetry</text>
    <text x="30" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Device &amp; network security context gathered</text>

    <!-- Telemetry Cards -->
    <rect x="25" y="85" width="370" height="75" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="40" y="110" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">📱 DEVICE HARDWARE SIGNATURE</text>
    <text x="40" y="130" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">OnePlus 9 • Android 13 • Chrome Mobile</text>
    <text x="40" y="146" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10">Trust Score: 45/100 (Unfamiliar Device Hardware)</text>

    <rect x="25" y="175" width="370" height="75" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="40" y="200" fill="#a855f7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🎙️ ACTIVE CALL / VOICE SHIELD</text>
    <text x="40" y="220" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Threat Detected: URGENCY_COERCION</text>
    <text x="40" y="236" fill="#ef4444" font-family="system-ui, sans-serif" font-size="10">Active Call Score: 96/100 (HIGH VISHING RISK)</text>

    <rect x="25" y="265" width="370" height="75" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="40" y="290" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🌐 GEOLOCATION &amp; IP PRIVACY</text>
    <text x="40" y="310" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Coarse Location: Kolkata, WB (Anomaly)</text>
    <text x="40" y="326" fill="#34d399" font-family="system-ui, sans-serif" font-size="10">IP Hash: SHA-256 (e3b0c442... [DPDP Compliant])</text>

    <rect x="25" y="355" width="370" height="75" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="40" y="380" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🕸️ SYNDICATE GRAPH TRAVERSAL</text>
    <text x="40" y="400" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Recipient linked to 4 reported mule accounts</text>
    <text x="40" y="416" fill="#fb7185" font-family="system-ui, sans-serif" font-size="10">Syndicate Risk Factor: 85/100</text>

    <!-- Privacy Note -->
    <rect x="25" y="455" width="370" height="85" rx="8" fill="#1e1e38"/>
    <text x="40" y="480" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🔒 ZERO-CREDENTIAL GUARANTEE</text>
    <text x="40" y="500" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">FraudShield never requests, stores, or logs your</text>
    <text x="40" y="516" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">UPI MPIN, Passwords, or OTP credentials.</text>
  </g>
</svg>
