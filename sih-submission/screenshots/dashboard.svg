    <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">VOICE SHIELD STATUS</text>
    <text x="20" y="70" fill="#c084fc" font-family="system-ui, sans-serif" font-size="28" font-weight="800">STANDBY</text>
