    <text x="300" y="97" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">AMOUNT</text>
    <text x="440" y="97" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">RISK SCORE</text>
    <text x="600" y="97" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">PRIMARY SIGNALS</text>
    <text x="920" y="97" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DISPOSITION</text>

    <!-- Row 1: Intercepted High Risk -->
    <rect x="30" y="120" width="1040" height="55" fill="#1e1e38" rx="6"/>
    <text x="45" y="145" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">urgent_kyc_support@upi</text>
    <text x="45" y="162" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Unrecognized Recipient</text>
    <text x="300" y="152" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">₹40,000</text>
