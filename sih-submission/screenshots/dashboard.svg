    <text x="45" y="210" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">rahul_new_freelancer@upi</text>
    <text x="45" y="227" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">First-time Recipient</text>
    <text x="300" y="217" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">₹8,000</text>
    <rect x="440" y="200" width="70" height="24" rx="12" fill="#78350f"/>
    <text x="475" y="216" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">54 MED</text>
    <text x="600" y="210" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">New Recipient Novelty + Moderate Amount</text>
    <text x="600" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">XAI: Warned and confirmed by user</text>
    <rect x="920" y="200" width="110" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="975" y="216" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CONFIRMED</text>

    <!-- Row 3: Low Risk -->
    <rect x="30" y="250" width="1040" height="55" fill="#141c2e" rx="6"/>
    <text x="45" y="275" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">groceries@upi (FreshMart)</text>
    <text x="45" y="292" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Habitual Merchant</text>
    <text x="300" y="282" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">₹500</text>
    <rect x="440" y="265" width="70" height="24" rx="12" fill="#064e3b"/>
    <text x="475" y="281" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">12 LOW</text>
    <text x="600" y="275" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Trusted Device + Normal Amount + Usual Hour</text>
    <text x="600" y="290" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">XAI: Standard routine transaction</text>
    <rect x="920" y="265" width="110" height="24" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="975" y="281" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">COMPLETED</text>
  </g>
</svg>
