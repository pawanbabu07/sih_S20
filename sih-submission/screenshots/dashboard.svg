    <text x="600" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">XAI: 8.0x above average, OTP demand active</text>
    <rect x="920" y="135" width="110" height="24" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
    <text x="975" y="151" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CANCELLED</text>

    <!-- Row 2: Medium Risk -->
