  <text x="240" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Dashboard</text>
  <text x="340" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Make Payment</text>
  <text x="460" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Voice Shield</text>
  <text x="570" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Security Center</text>

  <!-- User Profile Chip -->
  <rect x="1020" y="15" width="140" height="35" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="1038" cy="32" r="10" fill="#3b82f6"/>
  <text x="1055" y="37" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Rituraj M.</text>

  <!-- Header Content -->
