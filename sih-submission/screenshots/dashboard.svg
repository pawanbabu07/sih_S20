  <text x="50" y="138" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Real-time telemetry and explainable transaction defense status</text>

  <!-- 4 Stat Summary Cards -->
  <!-- Stat 1 -->
  <g transform="translate(50, 165)">
    <rect width="255" height="110" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ACCOUNT PROTECTION</text>
    <text x="20" y="70" fill="#34d399" font-family="system-ui, sans-serif" font-size="28" font-weight="800">ACTIVE 🟢</text>
    <text x="20" y="95" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">5 Multi-Signal Engines Online</text>
  </g>

  <!-- Stat 2 -->
  <g transform="translate(330, 165)">
    <rect width="255" height="110" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">TRUSTED DEVICE SCORE</text>
    <text x="20" y="70" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" font-weight="800">94 / 100</text>
    <text x="20" y="95" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11">Hardware Fingerprint Verified</text>
  </g>

  <!-- Stat 3 -->
  <g transform="translate(610, 165)">
    <rect width="255" height="110" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">INTERCEPTED ATTEMPTS</text>
    <text x="20" y="70" fill="#f87171" font-family="system-ui, sans-serif" font-size="28" font-weight="800">3 Prevented</text>
    <text x="20" y="95" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11">₹88,000 Total Value Protected</text>
  </g>

  <!-- Stat 4 -->
